[project]
name = "obdient"
version = "0.1.0"
description = "Read-only OBD-II diagnostic agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
obdient = "obdient.cli:app"

[dependency-groups]
dev = [
    # Dev-only, CC BY-NC-SA 4.0: never copy its code into this repo. Pinned (PRD R10).
    "ELM327-emulator==4.0.0",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obdient"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff formats Python blocks inside Markdown; SPEC.md and the docs must stay as written.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # "ambiguous" characters such as the minus sign and ° are intended
    "RUF002",
    "RUF003",
    "RUF012", # Pydantic copies mutable field defaults; ruff cannot see that through our Model base
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not emulator and not network and not llm'"
markers = [
    "emulator: needs ELM327-emulator running on a local TCP port",
    "network: makes real network calls",
    "llm: calls a model and spends OpenAI credits",
]
